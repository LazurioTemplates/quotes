id: settings
record:
  currency: CZK
  default_terms: Prices are given excluding VAT and including VAT at the current rates.
  default_vat_rate: standard
  email:
    body: |-
      Hello {contact},

      please find attached our quote {number} – {title}. It comes to {total} including VAT ({total_without_vat} excluding VAT) and is valid until {valid_until}.

      If you would like to change anything, just reply to this e-mail.

      Kind regards
      {prepared_by}
      {organization}
    subject: "Quote {number}: {title}"
  quote_number_format: Q-{YYYY}-{NNNN}
  supplier:
    bank_account: REPLACE-WITH-ORG-BANK-ACCOUNT
    city: REPLACE-WITH-ORG-CITY
    company_id: REPLACE-WITH-ORG-COMPANY-ID
    country: Czech Republic
    email: REPLACE-WITH-ORG-EMAIL
    name: REPLACE-WITH-ORG-NAME
    phone: REPLACE-WITH-ORG-PHONE
    postal_code: REPLACE-WITH-ORG-POSTAL-CODE
    street: REPLACE-WITH-ORG-STREET
    vat_id: REPLACE-WITH-ORG-VAT-ID
    web: REPLACE-WITH-ORG-WEB
  total_rounding: none
  validity_days: 30
  vat_rates:
    - id: standard
      label: Standard
      percent: 21
    - id: reduced
      label: Reduced
      percent: 12
    - id: zero
      label: Zero
      percent: 0
schemaVersion: quotes.settings.v1
